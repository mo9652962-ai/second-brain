name: Deploy site (landing + knowledge base)

# 部署结构（GitHub Pages）：
#   /       → 官网落地页（docs-site/，手写静态站）
#   /kb/    → MkDocs 知识库文档站（全库 tracked *.md 组装后构建）
#
# 修复记录（2026-09-21）：
#   旧配置未设 docs_dir，MkDocs 默认读取 docs/（仅 3 个文件），
#   nav 中 20 个条目全部「not found」→ 线上实际只有 2 个页面且无根 index.html。
#   现改为：用 git ls-files 组装全库 md → MKDOCS_DOCS_DIR 传入 → 构建 1044 页。

on:
  push:
    branches: [main, dev]
    paths:
      - "docs-site/**"
      - "**/*.md"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      # ── 1. 组装知识库源目录（全库 tracked *.md）──────────────
      - name: Assemble docs sources
        run: |
          set -euo pipefail
          python scripts/gen-llms-txt.py
          python scripts/okm_metabolism.py
          rm -rf .build-docs
          mkdir -p .build-docs/docs .build-docs/site
          # -z + quotePath=false：避免中文/特殊字符路径被加引号转义（CI 上会 cp 失败）
          # 私有隔离层硬门禁（2026-09-26）：即使有文件被误跟踪，也绝不发布到公开站点
          # 注：$f 来自 git ls-files（本仓库自身跟踪路径），非外部不可信输入 → 无注入面
          # memory/ 仅放行 MOC-Memory.md（mkdocs nav 的记忆索引锚点，本身不含私有内容）
          is_private_path() {
            case "$1" in
              memory/MOC-Memory.md) return 1 ;;
              memory/*|private_knowledge/*|private_vault/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          git -c core.quotePath=false ls-files -z '*.md' | while IFS= read -r -d '' f; do
            if is_private_path "$f"; then
              echo "::warning::skip private path: $f"
              continue
            fi
            mkdir -p ".build-docs/docs/$(dirname "$f")"
            cp "$f" ".build-docs/docs/$f"
          done
          # 同步新陈代谢最新看板
          if [ -f "knowledge/METABOLISM.md" ]; then
            cp "knowledge/METABOLISM.md" ".build-docs/docs/knowledge/METABOLISM.md"
          fi
          echo "assembled md files: $(find .build-docs/docs -name '*.md' | wc -l)"
          # 门禁：组装结果不得含任何私有路径
          if find .build-docs/docs -path '*memory/dreaming*' -o -path '*private_knowledge*' | grep -q .; then
            echo "::error::private content leaked into docs build"; exit 1
          fi

      # ── 2. 构建知识库文档站 → /kb/ ───────────────────────────
      - name: Build knowledge base
        env:
          MKDOCS_DOCS_DIR: .build-docs/docs
        run: |
          set -euo pipefail
          mkdocs build --config-file mkdocs.yml --site-dir .build-docs/site
          test -f .build-docs/site/index.html
          echo "kb pages: $(find .build-docs/site -name '*.html' | wc -l)"

      # ── 3. 组装最终站点：官网在根 + 知识库在 /kb/ ────────────
      - name: Assemble final site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R docs-site/. _site/
          mkdir -p _site/kb
          cp -R .build-docs/site/. _site/kb/
          test -f _site/index.html
          test -f _site/kb/index.html
          touch _site/.nojekyll
          echo "final: $(find _site -name '*.html' | wc -l) html files"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
