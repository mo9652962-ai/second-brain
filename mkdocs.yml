    - 单片机与边缘 AI: skills/hardware/Microcontroller-Edge-AI-2026.md
    - 硬件创业与开源生态: skills/hardware/Hardware-Startup-Open-Source-Ecosystem.md
  - 🧠 AI / MLOps:
    - MLOps & LLM 训练流水线: skills/ai/mlops-llm-training-pipeline.md
