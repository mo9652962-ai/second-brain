# MkDocs 配置文件
site_name: Second Brain 知识库
site_description: AI Agent 第二大脑 | Hermes 七大自举系统 | 硬件/PCB/单片机全链路知识库 | 学术写作工作流 | 全中文 Obsidian 知识库
site_author: mo9652962
site_url: https://mo9652962-ai.github.io/second-brain/

# 主题配置
theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate

# 插件
plugins:
  - search

# Markdown 扩展
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

# 页面导航
nav:
  - 首页: README.md
  - 🤖 Hermes 自举系统:
