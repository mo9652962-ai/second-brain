# MkDocs 配置文件 — Second Brain 知识库文档站
#
# 部署结构（GitHub Pages）：
#   /            → 官网落地页（docs-site/）
#   /kb/         → 本配置构建的知识库文档站
#
# docs_dir 默认指向 docs/（只有 3 个文件），会导致 nav 里绝大多数条目
# 「找不到文件」→ 站点实际只有 2 个页面。CI 通过 MKDOCS_DOCS_DIR 传入
# 组装好的目录（全库 tracked *.md），本地开发可自行指定。
site_name: Second Brain 知识库
site_description: AI Agent 第二大脑 | Hermes 七大自举系统 | 硬件/PCB/单片机全链路知识库 | 学术写作工作流 | 全中文 Obsidian 知识库
site_author: mo9652962
site_url: https://mo9652962-ai.github.io/second-brain/kb/

docs_dir: !ENV [MKDOCS_DOCS_DIR, docs]

# 主题配置
theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.integrate

# 插件
plugins:
  - search:
      lang: [zh, en]

# Markdown 扩展
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - codehilite
  - tables
  - toc:
      permalink: true

# 页面导航（每一项都对应仓库中真实存在的文件）
