# 跨 cron 计数单一权威源（2026-09-10 反思日记建立；9/8 反思行动项「计数收敛」硬截止 9/11 的落地骨架）
#
# 问题背景：闲鱼「第 N 天」等跨 cron 计数被 daily-todo-executor / vault-suggestion-executor /
# daily-review / 项目追踪多个 sibling cron 各自推进，不对称更新导致反复漂移（9/5、9/7、9/8、9/9
# 已 4 次手动修复）。收敛方案 = 本文件为唯一权威源 + 唯一写方 + 写后断言门禁。
#
# 规则（执行者必读）：
#   1. 唯一写方 = daily-todo-executor / vault-suggestion-executor 的闲鱼专项（每个工作日推进一天时，
#      先读本文件拿现值，+1 后写回本文件，再同步 current.md 文本）。
#   2. 其余 cron（daily-review / daily-reflection / 项目追踪 / health）只读引用本文件，禁止自行推进。
#   3. 每次写回后跑 `python scripts/assert_state_consistency.py` 做一致性断言，FAIL 即回查。
#   4. current.md 中的「第 N 天」文本 = 展示层，以本文件为准；本文件与 current.md 不一致时，
#      以本文件为准并修复 current.md（不要在 current.md 上推进后忘了回写本文件）。

